name: Nix

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Check the flake
        run: nix flake check
      - name: Build the library in the Nix development shell
        run: nix develop --command bash -c "lake exe cache get && lake build"
