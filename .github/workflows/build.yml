name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the source for sorry, new axioms and search tactics
        run: python3 scripts/check_source.py
      - uses: leanprover/lean-action@v1
      - name: Build the specification tests and the axiom audit
        run: lake build Test
      - name: Build the worked examples
        run: lake build Examples
