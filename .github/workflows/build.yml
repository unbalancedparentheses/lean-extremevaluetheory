name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the source for sorry, new axioms and search tactics
        run: python3 scripts/check_source.py
      - uses: leanprover/lean-action@v1
      - name: Build the specification tests and the axiom audit
        run: lake build Test
      - name: Check the theorem catalogue against Lean, and its gate against overclaiming
        run: python3 scripts/catalogue.py check
      - name: Report the catalogue's counts
        run: python3 scripts/catalogue.py report >> "$GITHUB_STEP_SUMMARY"
